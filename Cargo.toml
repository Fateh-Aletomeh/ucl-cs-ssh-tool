[package]
name = "ucl-cs-ssh-tool"
description = "CLI tool that makes sshing into UCL CS lab machines less annoying :)"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12.25", features = ["rustls-tls"] }
tokio = { version = "1.48.0", features = ["full"] }
scraper = "0.25"
directories = "5.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }